name: app_goldens

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/app/**"
      - ".github/workflows/app_goldens.yaml"
    branches:
      - main

permissions:
  contents: read # the App/PAT token performs the write/push

jobs:
  check-config:
    # Until the push credential is configured (see workflow docs), skip the
    # rest of the workflow gracefully instead of failing — keeps the check
    # green during setup.
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Check configuration
        id: config
        env:
          GOLDEN_BOT_APP_ID: ${{ secrets.GOLDEN_BOT_APP_ID }}
        run: |
          if [ -z "$GOLDEN_BOT_APP_ID" ]; then
            echo "GOLDEN_BOT_APP_ID secret is not set — skipping golden generation." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  update-goldens:
    needs: check-config
    # Skip fork PRs (the token can't push to a fork branch) and skip the bot's
    # own push (prevents a generate -> commit -> re-trigger loop). Replace
    # 'golden-bot[bot]' with the App's bot login (or the PAT owner's login).
    if: >-
      needs.check-config.outputs.enabled == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'golden-bot[bot]'
    # CI goldens use alchemist's deterministic font/renderer (platform goldens
    # are disabled in CI, see flutter_test_config.dart) so no macOS runner is
    # needed here.
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GOLDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GOLDEN_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get # workspace resolves from root

      - name: Update goldens
        working-directory: packages/app
        run: flutter test --update-goldens --tags golden

      - name: Commit goldens
        run: |
          git add packages/app/test # only ci/ PNGs surface; rest is gitignored
          git diff --cached --quiet && { echo "No golden changes."; exit 0; }
          git config user.name "golden-bot[bot]"
          git config user.email "golden-bot[bot]@users.noreply.github.com"
          git commit -m "test(app): update golden files"
          git push
